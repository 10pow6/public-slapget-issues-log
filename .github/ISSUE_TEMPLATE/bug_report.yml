name: 🐛 Bug Report
description: Report something that's broken or behaving unexpectedly in Slapget (web map or desktop engine).
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🐛

        **Before you start:** please [search existing issues](https://github.com/10pow6/public-slapget-issues-log/issues?q=is%3Aissue) to avoid duplicates.

        ⚠️ **Security issue?** Stop. Do not file it here. That includes TP6 payment or wallet problems, getting land or resources without paying, and seeing hidden deposits. See our [Security Policy](https://github.com/10pow6/public-slapget-issues-log/blob/main/SECURITY.md) and disclose privately via Discord.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through the Security Policy, not here).
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I paint parcels next to my property, the claim panel offers a new property instead of growing the existing one.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Web site (slapget.com)
        - Desktop engine
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Slapget?
      description: Pick the closest match.
      options:
        - Sign-in / 10pow6 account
        - Region catalog / Map
        - Claiming parcels / Pricing
        - My land / Properties / Expansion
        - TP6 wallet connection
        - Portals (TelePortals anchoring)
        - Public profile / Permalinks / Snapshots
        - Notifications
        - Engine — Install / Launch / Sign-in
        - Engine — World rendering / Camera / Day-night
        - Engine — Survey / Deposits
        - Engine — Gathering / Mining / Chopping
        - Engine — Storage / Depot Link / Building
        - Engine — Travel / Spawn / Bed
        - Engine — Controls / Keybinds
        - Help pages / Docs
        - Other / Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Do '...'
        4. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include any error messages you saw.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Region / property / parcel (optional)
      description: The region name, a property permalink, or parcel coordinates (x, y). Helps us find it fast.
      placeholder: e.g. Tokyo — https://slapget.com/p/... — parcel (412, 1033)
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or clip
      description: Drag and drop images or a short video here if the bug is visual. Optional, but very helpful. Redact wallet or account details.
    validations:
      required: false
  - type: input
    id: handle
    attributes:
      label: Handle (optional)
      description: Helps us look into account-specific issues. Leave blank if you'd rather not share.
    validations:
      required: false
  - type: input
    id: engine_version
    attributes:
      label: Engine version (if engine-related)
      description: Shown in the engine. Include the channel (e.g. beta) if you know it.
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop / Laptop
        - Mobile phone
        - Tablet
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 130 on Windows 11, Safari on iOS 18. For engine bugs, just the OS.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Any other context, how often it happens, recent changes, etc.
    validations:
      required: false
